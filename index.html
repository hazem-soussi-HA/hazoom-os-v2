  }

  const tab = browserTabs.find(t => t.id === browserTabId);
  const isHome = BRAI.isHome(tab);

  body.innerHTML = `<div class="br">
    <div class="br-tabs" id="brTabs-${winId}"></div>
    ${renderBookmarks()}
    <div class="br-toolbar">
      <button class="br-nav" id="brBack-${winId}">◀</button>
      <button class="br-nav" id="brFwd-${winId}">▶</button>
      <button class="br-nav" id="brReload-${winId}">⟳</button>
      <button class="br-nav" id="brHomeBtn-${winId}" title="Home">⌂</button>
      <span class="br-ssl ${isHome ? 'secure' : ''}" id="brSsl-${winId}">${isHome ? '🔒' : ''}</span>
      <input class="br-url" id="brUrl-${winId}" value="${isHome ? '' : (tab?.url || '')}">
      <span class="br-ssl" id="brStatus-${winId}" style="font-size:9px;width:auto"></span>
    </div>
    ${isHome ? renderHome() : renderContent('<div class="br-news-loading">Loading...</div>')}
  </div>`;

  async function fetchAndRender(url) {
    const contentEl = document.getElementById("brContent-" + winId);
    const statusIcon = document.getElementById("brStatus-" + winId);
    if (!contentEl) return;
    brLoading = true;
    if (statusIcon) statusIcon.textContent = '⏳';
    let html = null;
    let fromCache = false;

    // Try network first
    try {
      const proxyUrl = BRAI.proxyUrl(url);
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      html = await res.text();
      // Cache for offline
      if (OfflineEngine && OfflineEngine.cacheProxyPage) OfflineEngine.cacheProxyPage(url);
    } catch(e) {
      // Fallback to offline cache
      if (OfflineEngine && OfflineEngine.getOfflinePage) {
        const cached = await OfflineEngine.getOfflinePage(url);
        if (cached) { html = cached.html; fromCache = true; }
      }
    }

    if (html) {
      contentEl.innerHTML = `<base href="${new URL(url).origin}/" target="_blank">` + (fromCache ? `<div style="background:#fff3cd;color:#856404;padding:4px 8px;font-size:9px;text-align:center;font-family:Inter,sans-serif">📡 Cached offline — content may be outdated</div>` : '') + html;
      // Rewrite all links to go through proxy
      contentEl.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (href && (href.startsWith('http') || href.startsWith('/'))) {
          const fullUrl = href.startsWith('http') ? href : new URL(href, url).href;
          a.setAttribute('href', 'javascript:void(0)');
          a.addEventListener('click', ev => {
            ev.preventDefault();
            ev.stopPropagation();
            navigateTo(fullUrl);
          });
        }
      });
      contentEl.querySelectorAll('form[action]').forEach(f => {
        const action = f.getAttribute('action');
        if (action) {
          const fullUrl = action.startsWith('http') ? action : new URL(action, url).href;
          f.setAttribute('action', 'javascript:void(0)');
        }
      });
      if (statusIcon) statusIcon.textContent = fromCache ? '📡' : '✓';
      setTimeout(() => { if (statusIcon) statusIcon.textContent = ''; }, 2000);
    } else {
      contentEl.innerHTML = `<div style="padding:40px;text-align:center;font-family:Inter,sans-serif">
        <div style="font-size:48px;margin-bottom:16px">📡</div>
        <div style="font-size:16px;font-weight:600;color:#333;margin-bottom:8px">Offline — No Cache Available</div>
        <div style="font-size:12px;color:#666;margin-bottom:16px">This page hasn't been cached yet. Connect to the internet to cache it for offline use.</div>
        <div style="font-size:11px;color:#999">URL: ${url}</div>
        <button onclick="this.closest('.br-content').parentElement.querySelector('#brHomeBtn-${winId}').click()" style="margin-top:16px;padding:8px 20px;border-radius:8px;border:none;background:#6c5ce7;color:#fff;cursor:pointer">Go Home</button>
      </div>`;
      if (statusIcon) statusIcon.textContent = '❌';
    }
    brLoading = false;
  }

  function navigateTo(url) {
    if (url === 'home') { goHome(); return; }
    if (!url.startsWith("http")) url = "https://" + url;
    const t = browserTabs.find(x => x.id === browserTabId);
    if (t) { t.url = url; try { t.title = new URL(url).hostname; } catch(e) { t.title = url; } }
    brHistory = brHistory.slice(0, brHistoryIdx + 1);
    brHistory.push(url);
    brHistoryIdx = brHistory.length - 1;
    const urlInput = document.getElementById("brUrl-" + winId);
    if (urlInput) urlInput.value = url;
    const ssl = document.getElementById("brSsl-" + winId);
    if (ssl) { ssl.textContent = url.startsWith('https') ? '🔒' : '⚠️'; ssl.className = 'br-ssl ' + (url.startsWith('https') ? 'secure' : 'insecure'); }
    const contentEl = document.getElementById("brContent-" + winId);
    if (!contentEl) {
      body.querySelector('.br').innerHTML = `<div class="br-tabs" id="brTabs-${winId}"></div>${renderBookmarks()}<div class="br-toolbar"><button class="br-nav" id="brBack-${winId}">◀</button><button class="br-nav" id="brFwd-${winId}">▶</button><button class="br-nav" id="brReload-${winId}">⟳</button><button class="br-nav" id="brHomeBtn-${winId}" title="Home">⌂</button><span class="br-ssl ${url.startsWith('https') ? 'secure' : 'insecure'}" id="brSsl-${winId}">${url.startsWith('https') ? '🔒' : '⚠️'}</span><input class="br-url" id="brUrl-${winId}" value="${url}"><span class="br-ssl" id="brStatus-${winId}" style="font-size:9px;width:auto"></span></div>${renderContent('<div class="br-news-loading">Loading...</div>')}`;
      bindEvents();
    }
    renderTabs();
    let hostname = '';
    try { hostname = new URL(url).hostname; } catch(e) { hostname = url; }
    statusEl.textContent = `🌐 ${hostname}`;
    fetchAndRender(url);
  }

  function goHome() {
    const t = browserTabs.find(x => x.id === browserTabId);
    if (t) { t.url = 'home'; t.title = '🏠 Home'; }
    brHistory = [];
    brHistoryIdx = -1;
    body.querySelector('.br').innerHTML = `<div class="br-tabs" id="brTabs-${winId}"></div>${renderBookmarks()}<div class="br-toolbar"><button class="br-nav" id="brBack-${winId}">◀</button><button class="br-nav" id="brFwd-${winId}">▶</button><button class="br-nav" id="brReload-${winId}">⟳</button><button class="br-nav" id="brHomeBtn-${winId}" title="Home">⌂</button><span class="br-ssl secure" id="brSsl-${winId}">🔒</span><input class="br-url" id="brUrl-${winId}" value=""><span class="br-ssl" id="brStatus-${winId}" style="font-size:9px;width:auto"></span></div>${renderHome()}`;
    renderTabs();
    bindEvents();
    loadNews();
    statusEl.textContent = '🌐 Home';
  }

  async function loadNews() {
    const newsEl = document.getElementById("brNews-" + winId);
    if (!newsEl) return;
    let allItems = [];
    let fromCache = false;

    // Try network first
    try {
      const feeds = ['bbc', 'aljazeera', 'cnn', 'guardian', 'dw'];
      for (const f of feeds) {
        try {
          const res = await fetch(`/rss/${f}`);
          const data = await res.json();
          if (data.items) allItems.push(...data.items.map(i => ({ ...i, source: data.icon + ' ' + data.source })));
        } catch(e) {}
      }
    } catch(e) {}

    // Fallback to offline cache
    if (allItems.length === 0 && OfflineEngine && OfflineEngine.getOfflineNews) {
      const cached = await OfflineEngine.getOfflineNews();
      if (cached.length) {
        allItems = cached.map(i => ({ ...i, source: (i.source || '').replace(/^[^\s]+ /, '') }));
        fromCache = true;
      }
    }

    allItems.sort(() => Math.random() - 0.5);
    allItems = allItems.slice(0, 12);

    if (allItems.length) {
      const cacheBadge = fromCache ? '<div style="background:#fff3cd;color:#856404;padding:2px 8px;font-size:8px;text-align:center;border-radius:4px;margin-bottom:8px">📡 Cached offline</div>' : '';
      newsEl.innerHTML = cacheBadge + `<div class="br-news-grid">${allItems.map(item => `<div class="br-news-card" data-url="${item.link}"><div class="src">${item.source}</div><div class="title">${item.title}</div><div class="desc">${item.description.slice(0, 120)}...</div><div class="time">${item.pubDate ? new Date(item.pubDate).toLocaleDateString() : ''}</div></div>`).join('')}</div>`;
    } else {
      newsEl.innerHTML = '<div class="br-news-loading">📡 No news available offline. Connect to cache feeds.</div>';
    }
  }

  function bindEvents() {
    const urlInput = document.getElementById("brUrl-" + winId);
    if (urlInput) urlInput.addEventListener("keydown", e => { if (e.key === "Enter") { SFX.play('click'); navigateTo(e.target.value); } });
    const backBtn = document.getElementById("brBack-" + winId);
    if (backBtn) backBtn.addEventListener("click", () => {
      SFX.play('click');
      if (brHistoryIdx > 0) { brHistoryIdx--; navigateTo(brHistory[brHistoryIdx]); }
    });
    const fwdBtn = document.getElementById("brFwd-" + winId);
    if (fwdBtn) fwdBtn.addEventListener("click", () => {
      SFX.play('click');
      if (brHistoryIdx < brHistory.length - 1) { brHistoryIdx++; navigateTo(brHistory[brHistoryIdx]); }
    });
    const reloadBtn = document.getElementById("brReload-" + winId);
    if (reloadBtn) reloadBtn.addEventListener("click", () => {
      SFX.play('click');
      const t = browserTabs.find(x => x.id === browserTabId);
      if (t && t.url !== 'home') navigateTo(t.url);
    });
    const homeBtn = document.getElementById("brHomeBtn-" + winId);
    if (homeBtn) homeBtn.addEventListener("click", () => { SFX.play('click'); goHome(); });
    const searchInput = document.getElementById("brSearch-" + winId);
    const searchBtn = document.getElementById("brSearchBtn-" + winId);
    if (searchInput) searchInput.addEventListener("keydown", e => { if (e.key === "Enter") { SFX.play('click'); const q = e.target.value.trim(); if (q) navigateTo(q.includes('.') ? (q.startsWith('http') ? q : 'https://' + q) : 'https://www.google.com/search?q=' + encodeURIComponent(q)); } });
    if (searchBtn) searchBtn.addEventListener("click", () => { SFX.play('click'); const q = searchInput.value.trim(); if (q) navigateTo(q.includes('.') ? (q.startsWith('http') ? q : 'https://' + q) : 'https://www.google.com/search?q=' + encodeURIComponent(q)); });
  }

  renderTabs();
  bindEvents();
  if (isHome) loadNews();

  body.addEventListener("click", e => {
    if (e.target.id === "brNewTab-" + winId) {
      SFX.play('open');
      const id = ++browserTabId;
      browserTabs.push({ id, url: "home", title: "🏠 Home" });
      browserTabId = id;
      brHistory = [];
      brHistoryIdx = -1;
      renderTabs();
      goHome();
    }
    const tab = e.target.closest(".br-tab");
    if (tab && !e.target.closest(".br-tab-close")) {
      SFX.play('click');
      browserTabId = +tab.dataset.id;
      const t = browserTabs.find(x => x.id === browserTabId);
      if (t) {
        if (t.url === 'home') goHome();
        else navigateTo(t.url);
      }
    }
    const close = e.target.closest(".br-tab-close");
    if (close) {
      SFX.play('close');
      const id = +close.dataset.id;
      if (browserTabs.length <= 1) return;
      browserTabs = browserTabs.filter(t => t.id !== id);
      if (browserTabId === id) { browserTabId = browserTabs[0].id; const t = browserTabs[0]; if (t.url === 'home') goHome(); else navigateTo(t.url); }
      renderTabs();
    }
    const bm = e.target.closest(".br-bm");
    if (bm) { SFX.play('click'); navigateTo(bm.dataset.url); }
    const qi = e.target.closest(".br-quick-item");
    if (qi) { SFX.play('click'); navigateTo(qi.dataset.url); }
    const nc = e.target.closest(".br-news-card");
    if (nc) { SFX.play('click'); navigateTo(nc.dataset.url); }
  });
}

function renderProcessMgr(body, statusEl, winId) {
  let procInterval;
  let procSortField = "pid", procSortDir = "asc";

  function genProcData() {
    const names = ["systemd","bash","hazoom-wm","Xwayland","pipewire","pulseaudio","NetworkManager","polkitd","dbus-daemon","thermald","cron","rsyslogd","containerd","dockerd","sshd","nginx","python3","node","vim","top","htop","java","gcc","make"];
    processList = names.map((n, i) => ({
      pid: 1000 + i * 37,
      name: n,
      cpu: (Math.random() * 15).toFixed(1),
      mem: (Math.random() * 45 + 5).toFixed(1),
      status: Math.random() > 0.3 ? "Running" : "Sleeping"
    }));
  }

  function sortProcs() {
    processList.sort((a, b) => {
      let va = a[procSortField], vb = b[procSortField];
      if (procSortField === "pid" || procSortField === "cpu" || procSortField === "mem") { va = +va; vb = +vb; }
      return procSortDir === "asc" ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
    });
  }

  function render() {
    sortProcs();
    body.innerHTML = `<div class="proc"><div class="proc-header"><span style="font-size:11px;font-weight:600">Process Manager</span><span style="margin-left:auto;font-size:10px;color:var(--text3)">${processList.length} processes · Auto-refreshing</span></div><div class="proc-list"><div class="proc-row head"><span class="proc-head" data-sort="pid">PID ${procSortField==='pid'?(procSortDir==='asc'?'↑':'↓'):''}</span><span class="proc-head" data-sort="name">Name ${procSortField==='name'?(procSortDir==='asc'?'↑':'↓'):''}</span><span class="proc-head" data-sort="cpu">CPU% ${procSortField==='cpu'?(procSortDir==='asc'?'↑':'↓'):''}</span><span class="proc-head" data-sort="mem">MEM(MB) ${procSortField==='mem'?(procSortDir==='asc'?'↑':'↓'):''}</span><span class="proc-head" data-sort="status">Status ${procSortField==='status'?(procSortDir==='asc'?'↑':'↓'):''}</span><span></span></div>${processList.map(p => `<div class="proc-row"><span>${p.pid}</span><span>${p.name}</span><span>${p.cpu}%</span><span>${p.mem}</span><span class="${p.status==='Sleeping'?'status-sleep':''}">${p.status}</span><button class="kill" data-pid="${p.pid}" data-name="${p.name}">Kill</button></div>`).join("")}</div></div>`;
    statusEl.textContent = `⚙️ ${processList.length} processes | CPU avg: ${(processList.reduce((a,p) => a + +p.cpu, 0) / processList.length).toFixed(1)}% — 💡 Lynx recommends: optimize memory`;
  }

  genProcData();
  render();
  procInterval = setInterval(() => { genProcData(); render(); }, 2000);

  body.addEventListener("click", e => {
    const head = e.target.closest(".proc-head");
    if (head && head.dataset.sort) {
      SFX.play('click');
      const field = head.dataset.sort;
      if (procSortField === field) { procSortDir = procSortDir === "asc" ? "desc" : "asc"; }
      else { procSortField = field; procSortDir = "asc"; }
      render();
      return;
    }
    if (e.target.classList.contains("kill")) {
      SFX.play('delete');
      const pid = +e.target.dataset.pid;
      const procName = e.target.dataset.name;
      processList = processList.filter(p => p.pid !== pid);
      const w = windows.find(w => w.title.toLowerCase().includes(procName.toLowerCase().split('-')[0]) || w.appId === procName);
      if (w) window.closeWin(w.id);
      render();
      notify("⚙️", `Process ${pid} (${procName}) killed`);
    }
  });
}

    { id: "about", label: "ℹ️ About" }

    } else if (activePage === "wallpaper") {
      html = `<div class="set-section"><div class="set-label">WALLPAPER</div><div class="wp-grid">${WALLPAPERS.map((wp, i) => `<div class="wp-opt ${parseInt(localStorage.getItem("hazoom-wallpaper")) === i ? 'active' : ''}" data-idx="${i}" style="background:${wp.bg}">${wp.name}</div>`).join("")}</div></div>`;
    } else if (activePage === "about") {
      html = `<div class="set-section"><div class="set-label">ABOUT</div><div style="text-align:center;padding:20px"><div style="font-size:32px;font-weight:900;background:linear-gradient(135deg,#6c5ce7,#a29bfe,#4ecdc4);-webkit-background-clip:text;-webkit-text-fill-color:transparent">HAZOOM OS</div><div style="font-size:12px;color:var(--text2);margin-top:8px">Version 2.0.0</div><div style="font-size:11px;color:var(--text3);margin-top:4px">Build 2026.09.01</div></div></div>`;
    } else {
      html = `<div class="set-section"><div class="set-label">${activePage.toUpperCase()}</div><div class="set-row"><span>Feature 1</span><button class="set-toggle on"></button></div><div class="set-row"><span>Feature 2</span><button class="set-toggle"></button></div></div>`;
    }

    main.innerHTML = html;

    if (activePage === "wallpaper") {
      main.querySelectorAll(".wp-opt").forEach(el => {
        el.addEventListener("click", () => { setWallpaper(+el.dataset.idx); main.querySelectorAll(".wp-opt").forEach(x => x.classList.remove("active")); el.classList.add("active"); });
      });
    }

    main.querySelectorAll(".set-toggle").forEach(el => {
      el.addEventListener("click", () => el.classList.toggle("on"));
    });
  }

  body.innerHTML = `<div class="set"><div class="set-nav" id="setNav-${winId}">${pages.map(p => `<div class="set-item ${p.id === activePage ? 'active' : ''}" data-page="${p.id}">${p.label}</div>`).join("")}</div><div class="set-main" id="setMain-${winId}"></div></div>`;

  body.addEventListener("click", e => {
    const item = e.target.closest(".set-item");
    if (item) { SFX.play('click'); activePage = item.dataset.page; body.querySelectorAll(".set-item").forEach(x => x.classList.toggle("active", x.dataset.page === activePage)); renderPage(); }
  });

  renderPage();
}

function renderMusic(body, statusEl, winId) {
  const track = MUSIC.tracks[MUSIC.current];
  const pct = MUSIC.tracks[MUSIC.current].durationSec > 0 ? (MUSIC.elapsed / MUSIC.tracks[MUSIC.current].durationSec * 100).toFixed(1) : 0;
  const elapsed = Math.floor(MUSIC.elapsed);
  const eM = Math.floor(elapsed / 60);
  const eS = elapsed % 60;

  body.innerHTML = `<div class="mu"><div class="mu-art ${MUSIC.playing ? 'playing' : ''}" id="muArt-${winId}" style="transition:transform .3s,box-shadow .3s">${track.icon}</div><div class="mu-info"><div class="mu-title">${track.name}</div><div class="mu-artist">${track.key} · ${track.bpm} BPM</div></div><div class="mu-wave ${MUSIC.playing ? 'playing' : ''}" id="muWave-${winId}">${Array.from({length:12}, (_, i) => `<div class="mu-wave-bar" style="height:${4 + Math.random()*12}px"></div>`).join('')}</div><div class="mu-progress"><span class="mu-time">${eM}:${String(eS).padStart(2, '0')}</span><div class="mu-bar" id="muBar-${winId}"><div class="mu-bar-fill" id="muFill-${winId}" style="width:${pct}%"></div></div><span class="mu-time">${track.duration}</span></div><div class="mu-controls"><button class="mu-btn" id="muPrev-${winId}">⏮</button><button class="mu-btn play" id="muPlay-${winId}">${MUSIC.playing ? '⏸' : '▶'}</button><button class="mu-btn" id="muNext-${winId}">⏭</button></div><div style="display:flex;align-items:center;gap:6px;padding:0 8px"><span style="font-size:9px;color:var(--text3)">🔈</span><input type="range" id="muVol-${winId}" min="0" max="100" value="${Math.round(MUSIC.volume*100)}" style="flex:1;height:3px;accent-color:var(--accent)"><span style="font-size:9px;color:var(--text3)">🔊</span></div><div class="mu-list">${MUSIC.tracks.map((t, i) => `<div class="mu-track ${i === MUSIC.current ? 'active' : ''}" data-idx="${i}"><span style="font-size:14px;margin-right:4px">${t.icon}</span><span class="mu-track-n">${t.name}</span><span class="mu-track-dur">${t.duration}</span></div>`).join("")}</div></div>`;

  // Pulsing art animation
  const art = document.getElementById('muArt-' + winId);
  if (art && MUSIC.playing) {
    art.style.transform = 'scale(1.05)';
    art.style.boxShadow = '0 0 30px rgba(108,92,231,.3)';
  }

  statusEl.textContent = `${MUSIC.playing ? '▶' : '⏸'} ${track.name} — ${track.key} · ${track.bpm} BPM`;

function renderCalendar(body, statusEl, winId) {
  const now = new Date();
  calMonth = calMonth ?? now.getMonth();
  calYear = calYear ?? now.getFullYear();

  if (!Object.keys(calEvents).length) {
    const today = new Date();
    calEvents[`${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`] = [{ title: "Today's Meeting", color: "var(--accent)" }];
    calEvents[`${today.getFullYear()}-${today.getMonth()}-${today.getDate() + 1}`] = [{ title: "Lunch with team", color: "var(--success)" }];
    calEvents[`${today.getFullYear()}-${today.getMonth()}-${today.getDate() + 3}`] = [{ title: "Project deadline", color: "var(--danger)" }];
  }

  function render() {
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const daysInPrev = new Date(calYear, calMonth, 0).getDate();
    const today = new Date();
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    let days = "";
    for (let i = firstDay - 1; i >= 0; i--) days += `<div class="cal-day other">${daysInPrev - i}</div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
      days += `<div class="cal-day ${isToday ? 'today' : ''}" data-day="${d}">${d}</div>`;
    }
    const remaining = 42 - (firstDay + daysInMonth);
    for (let i = 1; i <= remaining; i++) days += `<div class="cal-day other">${i}</div>`;

    const eventsHtml = Object.entries(calEvents).filter(([k]) => { const [y, m, d] = k.split("-"); return +y === calYear && +m === calMonth; }).map(([, evts]) => evts.map(e => `<div class="cal-event"><div class="cal-event-dot" style="background:${e.color}"></div>${e.title}</div>`).join("")).join("");

    body.innerHTML = `<div class="cal"><div class="cal-header"><div class="cal-title">${monthNames[calMonth]} ${calYear}</div><div class="cal-nav"><button class="cal-today" id="calToday-${winId}">Today</button><button id="calPrev-${winId}">◀</button><button id="calNext-${winId}">▶</button></div></div><div class="cal-grid"><div class="cal-dh">Sun</div><div class="cal-dh">Mon</div><div class="cal-dh">Tue</div><div class="cal-dh">Wed</div><div class="cal-dh">Thu</div><div class="cal-dh">Fri</div><div class="cal-dh">Sat</div>${days}</div>${eventsHtml ? `<div class="cal-events">${eventsHtml}</div>` : ''}</div>`;
    statusEl.textContent = `📅 ${monthNames[calMonth]} ${calYear}`;
  }

  render();

  body.addEventListener("click", e => {
    if (e.target.id === "calPrev-" + winId) { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } render(); }
    if (e.target.id === "calNext-" + winId) { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } render(); }
    if (e.target.id === "calToday-" + winId) { const now = new Date(); calMonth = now.getMonth(); calYear = now.getFullYear(); render(); SFX.play('click'); }
  });
}

function renderDiskUsage(body, statusEl, winId) {
  const partitions = [
    { name: "/", used: 24.5, total: 100, color: "var(--accent)" },
    { name: "/home", used: 18.2, total: 50, color: "var(--accent3)" },
    { name: "/tmp", used: 2.1, total: 10, color: "var(--warn)" },
    { name: "/var", used: 8.7, total: 20, color: "var(--danger)" },
    { name: "/usr", used: 12.3, total: 30, color: "#a29bfe" }
  ];

  const totalUsed = partitions.reduce((a, p) => a + p.used, 0);
  const totalAll = partitions.reduce((a, p) => a + p.total, 0);

  function renderPie(data) {
    let gradientParts = [];
    let current = 0;
    data.forEach(d => {
      const pct = d.used / d.total * 100;
      gradientParts.push(`${d.color} ${current}% ${current + pct}%`);
      current += pct;
    });
    return `conic-gradient(${gradientParts.join(", ")})`;
  }

  body.innerHTML = `<div style="padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;height:100%"><div style="width:160px;height:160px;border-radius:50%;background:${renderPie(partitions)};position:relative"><div style="position:absolute;inset:25px;border-radius:50%;background:var(--glass2);display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="font-size:20px;font-weight:800">${totalUsed.toFixed(1)} GB</div><div style="font-size:9px;color:var(--text3)">of ${totalAll} GB</div></div></div><div style="width:100%">${partitions.map(p => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)"><div style="width:8px;height:8px;border-radius:50%;background:${p.color};flex-shrink:0"></div><span style="font-size:11px;flex:1">${p.name}</span><span style="font-size:10px;color:var(--text3)">${p.used} / ${p.total} GB</span><div style="width:80px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden"><div style="height:100%;width:${p.used/p.total*100}%;background:${p.color};border-radius:2px"></div></div></div>`).join("")}</div></div>`;
  statusEl.textContent = `💿 ${totalUsed.toFixed(1)} GB / ${totalAll} GB used`;
}

function initPing(body, wid) {
  body.innerHTML = `
    <div class="ping">
      <div class="ping-target">
        <input class="ping-input" id="pingHost-${wid}" value="8.8.8.8" placeholder="Host / IP / URL">
        <button class="ping-btn" id="pingStart-${wid}">Ping</button>
        <button class="ping-btn" id="pingStop-${wid}" style="background:var(--danger)" disabled>Stop</button>
      </div>
      <div class="ping-results" id="pingResults-${wid}">Ready to ping. Enter a host and click Ping.\n\nSupported targets:\n• IP: 8.8.8.8, 1.1.1.1\n• Domain: google.com, cloudflare.com\n• URL: https://example.com</div>
      <div class="ping-stats" id="pingStats-${wid}">
        <div class="ping-stat"><div class="ping-stat-val" id="pingMin-${wid}" style="color:var(--success)">--</div><div class="ping-stat-lbl">Min</div></div>
        <div class="ping-stat"><div class="ping-stat-val" id="pingAvg-${wid}" style="color:var(--accent2)">--</div><div class="ping-stat-lbl">Avg</div></div>
        <div class="ping-stat"><div class="ping-stat-val" id="pingMax-${wid}" style="color:var(--warn)">--</div><div class="ping-stat-lbl">Max</div></div>
        <div class="ping-stat"><div class="ping-stat-val" id="pingLoss-${wid}" style="color:var(--danger)">0%</div><div class="ping-stat-lbl">Loss</div></div>
      </div>
      <div class="ping-chart" id="pingChart-${wid}"></div>
    </div>`;

  const resultsEl = document.getElementById(`pingResults-${wid}`);
  const startBtn = document.getElementById(`pingStart-${wid}`);
  const stopBtn = document.getElementById(`pingStop-${wid}`);
  const hostInput = document.getElementById(`pingHost-${wid}`);
  let pingInterval = null;
  let pingCount = 0;
  let pingTimes = [];
  let pingHistory = [];

  async function doPing() {
    const host = hostInput.value.trim();
    if (!host) return;

    pingCount++;
    const startTime = performance.now();

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);

      await fetch(`https://${host.replace(/^https?:\/\//, '')}`, {
        mode: 'no-cors',
        signal: controller.signal,
        cache: 'no-store'
      }).catch(() => {});

      clearTimeout(timeout);
      const elapsed = Math.round(performance.now() - startTime);

      pingTimes.push(elapsed);
      pingHistory.push(elapsed);
      if (pingHistory.length > 30) pingHistory.shift();

      const seq = pingCount;
      const line = `Reply from ${host}: bytes=32 time=${elapsed}ms TTL=56`;
      resultsEl.innerHTML += `\n<span style="color:var(--success)">${line}</span>`;

      const min = Math.min(...pingTimes);
      const max = Math.max(...pingTimes);
      const avg = Math.round(pingTimes.reduce((a, b) => a + b, 0) / pingTimes.length);
      const loss = 0;

      document.getElementById(`pingMin-${wid}`).textContent = min + 'ms';
      document.getElementById(`pingAvg-${wid}`).textContent = avg + 'ms';
      document.getElementById(`pingMax-${wid}`).textContent = max + 'ms';
      document.getElementById(`pingLoss-${wid}`).textContent = loss + '%';

      renderPingChart(wid, pingHistory);

      SFX.play('click');
    } catch (e) {
      const elapsed = Math.round(performance.now() - startTime);
      pingTimes.push(elapsed);
      pingHistory.push(elapsed);
      if (pingHistory.length > 30) pingHistory.shift();

      resultsEl.innerHTML += `\n<span style="color:var(--warn)">Reply from ${host}: time=${elapsed}ms (unverified)</span>`;

      const avg = pingTimes.length ? Math.round(pingTimes.reduce((a, b) => a + b, 0) / pingTimes.length) : '--';
      document.getElementById(`pingAvg-${wid}`).textContent = avg + 'ms';

      renderPingChart(wid, pingHistory);
    }

    resultsEl.scrollTop = resultsEl.scrollHeight;
  }

  startBtn.addEventListener('click', () => {
    if (pingInterval) return;
    pingCount = 0;
    pingTimes = [];
    pingHistory = [];
    resultsEl.innerHTML = `Pinging ${hostInput.value}...\n`;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    SFX.play('click');
    doPing();
    pingInterval = setInterval(doPing, 1000);
  });

  stopBtn.addEventListener('click', () => {
    clearInterval(pingInterval);
    pingInterval = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    const avg = pingTimes.length ? Math.round(pingTimes.reduce((a, b) => a + b, 0) / pingTimes.length) : '--';
    resultsEl.innerHTML += `\n\n--- Ping statistics ---\n${pingCount} packets sent, ${pingCount} received, 0% loss\nRound-trip: min=${pingTimes.length ? Math.min(...pingTimes) : '--'}ms avg=${avg}ms max=${pingTimes.length ? Math.max(...pingTimes) : '--'}ms`;
    SFX.play('click');
  });
}

function renderPingChart(wid, history) {
  const chart = document.getElementById(`pingChart-${wid}`);
  if (!chart || !history.length) return;
  const max = Math.max(...history, 1);
  chart.innerHTML = history.map(v => {
    const h = Math.max(2, (v / max) * 100);
    const color = v < 50 ? 'var(--success)' : v < 150 ? 'var(--accent2)' : 'var(--warn)';
    return `<div class="ping-chart-bar" style="height:${h}%;background:${color}"></div>`;
  }).join('');
}

function getMostUsedApps() {
  const counts = {};
  AI.history.forEach(h => { counts[h.agent] = (counts[h.agent] || 0) + 1; });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,3).map(([k,v]) => `${AI.agents[k]?.name || k}(${v})`).join(', ') || 'No data yet';
}

function getContextProverb() {
  const context = {
    idle: "Patience is the companion of wisdom.",
    busy: "The ox carries the weight but sees the horizon.",
    manyWindows: "He who chases two rabbits catches neither.",
    lowMemory: "A thin dog wags its tail fast.",
    startup: "Every journey begins with a single keystroke.",
    shutdown: "Even the owl must sleep.",
    coding: "In the realm of code, every semicolon is a decision.",
    files: "A place for everything, and everything in its place."
  };
  if (windows.length > 5) return context.manyWindows;
  if (performance.memory && performance.memory.usedJSHeapSize > 500000000) return context.lowMemory;
  if (performance.now() < 30000) return context.startup;
  return context.idle;
}

function startAmbientAI() {
  setInterval(() => {
    const insight = AI.getAmbientInsight();
    const agent = AI.agents[insight.agent];
    const toast = document.createElement('div');
    toast.className = 'notif';
    toast.style.cursor = 'pointer';
    toast.innerHTML = `<span style="font-size:14px">${agent.icon}</span><div><div style="font-size:10px;color:${agent.color};font-weight:600;margin-bottom:2px">${agent.name}</div><div style="font-size:10px;color:var(--text2);line-height:1.4">${insight.msg}</div></div>`;
    toast.onclick = () => { openApp('ai'); AI.switchAgent(insight.agent); toast.remove(); };
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('hide'), 5000);
    setTimeout(() => toast.remove(), 5500);
  }, 45000 + Math.random() * 45000);
}

function renderAI(body, statusEl, winId) {
  body.innerHTML = `
    <div class="ai">
      <div class="ai-agents" id="${winId}_agents"></div>
      <div class="ai-messages" id="${winId}_msgs"></div>
      <div class="ai-input-wrap">
        <input class="ai-input" id="${winId}_input" placeholder="Ask Ox Alpha anything..." autocomplete="off">
        <button class="ai-send" id="${winId}_send">→</button>
      </div>
      <div class="ai-status"><div class="ai-status-dot"></div><span>Ox Alpha online · All agents operational</span></div>
    </div>`;

  const agentBar = document.getElementById(winId + '_agents');
  const msgs = document.getElementById(winId + '_msgs');
  const input = document.getElementById(winId + '_input');
  const sendBtn = document.getElementById(winId + '_send');

  Object.entries(AI.agents).forEach(([id, agent]) => {
    const btn = document.createElement('button');
    btn.className = 'ai-agent-btn' + (id === AI.activeAgent ? ' active' : '');
    btn.innerHTML = `<div class="dot" style="background:${agent.color}"></div>${agent.icon} ${agent.name}`;
    btn.onclick = () => {
      AI.switchAgent(id);
      agentBar.querySelectorAll('.ai-agent-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      input.placeholder = `Ask ${agent.name} anything...`;
      addAgentMsg(agent.greet, agent);
      SFX.play('click');
    };
    agentBar.appendChild(btn);
  });

  function addAgentMsg(text, agent) {
    const div = document.createElement('div');
    div.className = 'ai-msg agent';
    div.innerHTML = `<div class="agent-badge" style="color:${agent.color}">${agent.icon} ${agent.name}</div>${escapeHtml(text)}`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addUserMsg(text) {
    const div = document.createElement('div');
    div.className = 'ai-msg user';
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function send() {
    const q = input.value.trim();
    if (!q) return;
    addUserMsg(q);
    input.value = '';
    SFX.play('type');
    setTimeout(() => {
      const response = AI.chat(q);
      const agent = AI.agents[AI.activeAgent];
      addAgentMsg(response, agent);
      SFX.play('notify');
    }, 300 + Math.random() * 500);
  }

  sendBtn.onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  addAgentMsg(AI.agents.ox.greet, AI.agents.ox);
  statusEl.textContent = '🧠 AI Agent — Ox Alpha online';
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.key === "Shift" && e.code === "KeyC") { e.preventDefault(); toggleClipboard(); }
  if (e.key === "Escape") { closeShutdown(); }
  if (e.ctrlKey && e.key === "f") {
    const focusedWin = windows.find(w => w.id === focusedWinId);
    if (focusedWin && focusedWin.appId === "texteditor") {
      e.preventDefault();
      const findBar = document.getElementById(focusedWinId + "_findbar");
      if (findBar) {
        findBar.style.display = findBar.style.display === "none" ? "flex" : "none";
        if (findBar.style.display === "flex") {
          const fi = document.getElementById(focusedWinId + "_findinput");
          if (fi) fi.focus();
        }
      }
    }
  }
});

const BG = {
  canvas: null,
  ctx: null,
  W: 0,
  H: 0,
  frame: 0,
  particles: [],
  agents: [],
  shapes: [],
  lightAngle: 0,
  lastFrame: 0,

  init() {
    this.canvas = document.createElement('canvas');
    this.canvas.id = 'bgCanvas';
    this.canvas.style.cssText = 'position:fixed;inset:0;z-index:0;pointer-events:none';
    document.getElementById('desktop').prepend(this.canvas);
    this.ctx = this.canvas.getContext('2d', { alpha: false, desynchronized: true });
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.initParticles();
    this.initAgents();
    this.initShapes();
    this.render();
  },

  resize() {
    this.W = this.canvas.width = innerWidth;
    this.H = this.canvas.height = innerHeight;
    this.agents.forEach(a => {
      if (a.x > this.W) a.x = this.W - 30;
      if (a.y > this.H) a.y = this.H - 30;
    });
  },

  initParticles() {
    for (let i = 0; i < 30; i++) {
      this.particles.push({
        x: Math.random() * this.W,
        y: Math.random() * this.H,
        r: 0.5 + Math.random() * 2,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -(0.1 + Math.random() * 0.4),
        alpha: 0.1 + Math.random() * 0.3,
        depth: 0.3 + Math.random() * 0.7,
        hue: 220 + Math.random() * 40
      });
    }
  },

  initAgents() {
    const agentData = [
      { emoji: '🐂', name: 'Ox', color: '#6c5ce7', speed: 0.4, x: 0.2, y: 0.3 },
      { emoji: '🦉', name: 'Owl', color: '#feca57', speed: 0.3, x: 0.7, y: 0.2 },
      { emoji: '⚕', name: 'Doc', color: '#4ecdc4', speed: 0.35, x: 0.5, y: 0.6 },
      { emoji: '🎯', name: 'Hunter', color: '#ff6b6b', speed: 0.6, x: 0.3, y: 0.7 },
      { emoji: '🐱', name: 'Lynx', color: '#a29bfe', speed: 0.55, x: 0.8, y: 0.5 }
    ];
    agentData.forEach(a => {
      this.agents.push({
        ...a,
        x: a.x * this.W,
        y: a.y * this.H,
        vx: (Math.random() - 0.5) * a.speed,
        vy: (Math.random() - 0.5) * a.speed,
        targetX: Math.random() * this.W,
        targetY: Math.random() * this.H,
        state: 'wander',
        stateTimer: 0,
        chaseTarget: null,
        trail: [],
        size: 16 + Math.random() * 4
      });
    });
  },

  initShapes() {
    for (let i = 0; i < 8; i++) {
      this.shapes.push({
        x: Math.random() * this.W,
        y: Math.random() * this.H,
        size: 20 + Math.random() * 60,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.005,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.15,
        type: ['circle', 'hexagon', 'triangle', 'diamond'][Math.floor(Math.random() * 4)],
        alpha: 0.02 + Math.random() * 0.04,
        depth: 0.2 + Math.random() * 0.5,
        hue: 200 + Math.random() * 80
      });
    }
  },

  drawGrid(t) {
    const ctx = this.ctx;
    const spacing = 80;
    const wave = Math.sin(t * 0.0003) * 20;
    ctx.globalAlpha = 0.015;
    ctx.strokeStyle = '#6c5ce7';
    ctx.lineWidth = 0.5;
    for (let y = 0; y < this.H + spacing; y += spacing) {
      ctx.beginPath();
      for (let x = 0; x <= this.W; x += 30) {
        const warp = Math.sin(x * 0.005 + t * 0.001) * wave;
        const warpY = Math.sin(y * 0.003 + t * 0.0005) * wave * 0.5;
        if (x === 0) ctx.moveTo(x, y + warp + warpY);
        else ctx.lineTo(x, y + warp + warpY);
      }
      ctx.stroke();
    }
    for (let x = 0; x < this.W + spacing; x += spacing) {
      ctx.beginPath();
      for (let y = 0; y <= this.H; y += 30) {
        const warp = Math.sin(y * 0.005 + t * 0.001) * wave;
        const warpX = Math.sin(x * 0.003 + t * 0.0005) * wave * 0.5;
        if (y === 0) ctx.moveTo(x + warp + warpX, y);
        else ctx.lineTo(x + warp + warpX, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  },

  drawLightBeams(t) {
    const ctx = this.ctx;
    for (let i = 0; i < 3; i++) {
      const angle = -0.3 + Math.sin(t * 0.0001 + i * 2) * 0.15;
      const x = this.W * (0.2 + i * 0.3) + Math.sin(t * 0.0002 + i) * 100;
      ctx.save();
      ctx.translate(x, -50);
      ctx.rotate(angle);
      const grad = ctx.createLinearGradient(0, 0, 0, this.H * 1.5);
      grad.addColorStop(0, `hsla(${240 + i * 20}, 60%, 70%, 0.02)`);
      grad.addColorStop(0.5, `hsla(${240 + i * 20}, 60%, 70%, 0.008)`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(-40, 0, 80, this.H * 1.5);
      ctx.restore();
    }
  },

  drawParticles() {
    const ctx = this.ctx;
    this.particles.forEach(p => {
      p.x += p.vx * p.depth;
      p.y += p.vy * p.depth;
      if (p.y < -10) { p.y = this.H + 10; p.x = Math.random() * this.W; }
      if (p.x < -10) p.x = this.W + 10;
      if (p.x > this.W + 10) p.x = -10;
      ctx.globalAlpha = p.alpha * p.depth;
      ctx.fillStyle = `hsl(${p.hue}, 40%, 60%)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.depth, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  },

  drawShapes(t) {
    const ctx = this.ctx;
    this.shapes.forEach(s => {
      s.x += s.vx;
      s.y += s.vy;
      s.rotation += s.rotSpeed;
      if (s.x < -s.size) s.x = this.W + s.size;
      if (s.x > this.W + s.size) s.x = -s.size;
      if (s.y < -s.size) s.y = this.H + s.size;
      if (s.y > this.H + s.size) s.y = -s.size;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rotation);
      ctx.globalAlpha = s.alpha;
      ctx.strokeStyle = `hsl(${s.hue}, 40%, 50%)`;
      ctx.lineWidth = 1;
      if (s.type === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, s.size / 2, 0, Math.PI * 2);
        ctx.stroke();
      } else if (s.type === 'hexagon') {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI * 2 / 6) * i;
          const px = Math.cos(angle) * s.size / 2;
          const py = Math.sin(angle) * s.size / 2;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.stroke();
      } else if (s.type === 'triangle') {
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const angle = (Math.PI * 2 / 3) * i - Math.PI / 2;
          const px = Math.cos(angle) * s.size / 2;
          const py = Math.sin(angle) * s.size / 2;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.stroke();
      } else if (s.type === 'diamond') {
        ctx.beginPath();
        ctx.moveTo(0, -s.size / 2);
        ctx.lineTo(s.size / 2, 0);
        ctx.lineTo(0, s.size / 2);
        ctx.lineTo(-s.size / 2, 0);
        ctx.closePath(); ctx.stroke();
      }
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  },

  drawAgents(t) {
    const ctx = this.ctx;
    this.agents.forEach((a, i) => {
      a.stateTimer--;
      if (a.stateTimer <= 0) {
        const roll = Math.random();
        if (roll < 0.6) {
          a.state = 'wander';
          a.targetX = Math.random() * this.W;
          a.targetY = Math.random() * this.H;
          a.stateTimer = 200 + Math.random() * 300;
        } else if (roll < 0.85) {
          a.state = 'idle';
          a.vx *= 0.5; a.vy *= 0.5;
          a.stateTimer = 60 + Math.random() * 120;
        } else {
          const others = this.agents.filter((_, j) => j !== i);
          a.chaseTarget = others[Math.floor(Math.random() * others.length)];
          a.state = 'chase';
          a.stateTimer = 100 + Math.random() * 150;
        }
      }
      if (a.state === 'wander') {
        const dx = a.targetX - a.x;
        const dy = a.targetY - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 5) {
          a.vx += (dx / dist) * 0.02;
          a.vy += (dy / dist) * 0.02;
        }
      } else if (a.state === 'chase' && a.chaseTarget) {
        const dx = a.chaseTarget.x - a.x;
        const dy = a.chaseTarget.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 10) {
          a.vx += (dx / dist) * 0.04;
          a.vy += (dy / dist) * 0.04;
        }
        if (dist < 20) { a.state = 'idle'; a.stateTimer = 80; }
      }
      a.vx *= 0.98; a.vy *= 0.98;
      const speed = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
      const maxSpeed = a.speed * 1.5;
      if (speed > maxSpeed) { a.vx = (a.vx / speed) * maxSpeed; a.vy = (a.vy / speed) * maxSpeed; }
      a.x += a.vx; a.y += a.vy;
      if (a.x < 30) { a.x = 30; a.vx = Math.abs(a.vx) * 0.8; }
      if (a.x > this.W - 30) { a.x = this.W - 30; a.vx = -Math.abs(a.vx) * 0.8; }
      if (a.y < 30) { a.y = 30; a.vy = Math.abs(a.vy) * 0.8; }
      if (a.y > this.H - 80) { a.y = this.H - 80; a.vy = -Math.abs(a.vy) * 0.8; }
      a.trail.push({ x: a.x, y: a.y });
      if (a.trail.length > 8) a.trail.shift();
      if (a.state === 'chase') {
        a.trail.forEach((p, j) => {
          const alpha = j / a.trail.length;
          ctx.fillStyle = a.color;
          ctx.globalAlpha = alpha * 0.1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3 + alpha * 4, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }
      const bobY = Math.sin(t * 0.005 + i) * 3;
      const lean = a.vx * 0.1;
      ctx.save();
      ctx.translate(a.x, a.y + bobY);
      ctx.rotate(lean);
      ctx.shadowColor = a.color;
      ctx.shadowBlur = a.state === 'chase' ? 15 : 8;
      ctx.font = `${a.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(a.emoji, 0, 0);
      ctx.shadowBlur = 0;
      ctx.font = '8px Inter, sans-serif';
      ctx.fillStyle = a.color;
      ctx.globalAlpha = 0.6;
      ctx.fillText(a.name, 0, a.size / 2 + 8);
      ctx.restore();
      ctx.globalAlpha = 1;
    });
  },

  render(t) {
    requestAnimationFrame((t) => this.render(t));
    if (t == null) t = 0;
    const dt = t - this.lastFrame;
    if (dt < 33) return;
    this.lastFrame = t;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.W, this.H);
    const bg = ctx.createRadialGradient(this.W * 0.3, this.H * 0.4, 0, this.W * 0.5, this.H * 0.5, this.W * 0.7);
    bg.addColorStop(0, 'rgba(15, 18, 30, 0.95)');
    bg.addColorStop(0.5, 'rgba(10, 12, 20, 0.98)');
    bg.addColorStop(1, '#000');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, this.W, this.H);
    if (this.frame % 2 === 0) this.drawGrid(t);
    if (dt < 50) this.drawLightBeams(t);
    this.drawShapes(t);
    this.drawParticles();
    this.drawAgents(t);
    this.frame++;
  }
};

    inited = true;
    try { HOVER_SFX.init(); } catch(e) {}
    try { MUSIC.init(); } catch(e) {}
    document.removeEventListener('click', initAudioSystems);

  }
  document.addEventListener('click', initAudioSystems);
  document.addEventListener('keydown', initAudioSystems);
})();

// === OFFLINE ENGINE — The Online of the Offline ===
const OfflineEngine = {
  isOnline: navigator.onLine,
  sw: null,
  db: null,

  async init() {
    // Register service worker
    if ('serviceWorker' in navigator) {
      try {
        this.sw = await navigator.serviceWorker.register('/sw.js');
        console.log('🔧 Service Worker registered');
      } catch(e) { console.log('SW error:', e); }
    }

    // Init IndexedDB for offline news
    this.initDB();

    // Online/offline listeners
    window.addEventListener('online', () => this.onOnline());
    window.addEventListener('offline', () => this.onOffline());

    // Initial state
    this.updateIndicator();
    if (this.isOnline) this.cacheNews();
  },

  initDB() {
    return new Promise(resolve => {
      const req = indexedDB.open('hazoom-offline', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('news')) db.createObjectStore('news', { keyPath: 'link' });
        if (!db.objectStoreNames.contains('pages')) db.createObjectStore('pages', { keyPath: 'url' });
        if (!db.objectStoreNames.contains('proxy')) db.createObjectStore('proxy', { keyPath: 'url' });
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(); };
      req.onerror = () => resolve();
    });
  },

  async cacheNews() {
    if (!this.db) return;
    try {
      const feeds = ['bbc', 'aljazeera', 'cnn', 'guardian', 'dw'];
      for (const f of feeds) {
        const res = await fetch(`/rss/${f}`);
        const data = await res.json();
        if (data.items) {
          const tx = this.db.transaction('news', 'readwrite');
          const store = tx.objectStore('news');
          data.items.forEach(item => store.put({ ...item, source: f, cachedAt: Date.now() }));
        }
      }
      console.log('📰 News cached for offline');
    } catch(e) {}
  },

  async cacheProxyPage(url) {
    if (!this.db) return;
    try {
      const res = await fetch(`/proxy?url=${encodeURIComponent(url)}`);
      const html = await res.text();
      const tx = this.db.transaction('proxy', 'readwrite');
      tx.objectStore('proxy').put({ url, html, cachedAt: Date.now() });
    } catch(e) {}
  },

  async getOfflineNews() {
    if (!this.db) return [];
    return new Promise(resolve => {
      const tx = this.db.transaction('news', 'readonly');
      const store = tx.objectStore('news');
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  },

  async getOfflinePage(url) {
    if (!this.db) return null;
    return new Promise(resolve => {
      const tx = this.db.transaction('proxy', 'readonly');
      const req = tx.objectStore('proxy').get(url);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  },

  onOnline() {
    this.isOnline = true;
    this.updateIndicator();
    this.cacheNews();
    SFX.play('notify');
    this.showToast('🟢 Back online');
    // Notify all browser windows
    document.querySelectorAll('.br-content').forEach(el => {
      const btn = el.closest('.win-body')?.querySelector('#brReload-' + el.id.split('-')[1]);
      if (btn) btn.click();
    });
  },

  onOffline() {
    this.isOnline = false;
    this.updateIndicator();
    SFX.play('warn');
    this.showToast('🔴 You are offline — cached content available');
  },

  updateIndicator() {
    let indicator = document.getElementById('offline-indicator');
    if (!indicator) {
      indicator = document.createElement('div');
      indicator.id = 'offline-indicator';
      indicator.style.cssText = 'position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99999;padding:4px 16px;border-radius:0 0 8px 8px;font-size:10px;font-family:Inter,sans-serif;display:none;pointer-events:none;transition:all .3s';
      document.body.appendChild(indicator);
    }
    if (this.isOnline) {
      indicator.style.display = 'none';
    } else {
      indicator.textContent = '📡 Offline Mode — Cached content available';
      indicator.style.display = 'block';
      indicator.style.background = 'rgba(255,107,107,.9)';
      indicator.style.color = '#fff';
    }
  },

  showToast(msg) {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:50px;left:50%;transform:translateX(-50%);z-index:99999;padding:8px 20px;border-radius:8px;background:rgba(0,0,0,.85);color:#fff;font-size:11px;font-family:Inter,sans-serif;pointer-events:none;animation:fadeInUp .3s ease';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
  }
};

OfflineEngine.init();

})();

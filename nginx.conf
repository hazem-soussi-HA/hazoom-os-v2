server {
    listen 80;
    server_name hazoom.local;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hazoom.local;

    ssl_certificate /etc/ssl/hazoom.crt;
    ssl_certificate_key /etc/ssl/hazoom.key;

    root /var/www/hazoom-os;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Cache static assets
    location ~* \.(html|css|js|png|jpg|gif|ico|svg|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://127.0.0.1:8888;
    }
}

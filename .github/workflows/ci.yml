name: HAZOOM OS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - name: Health Check
        run: |
          node server.js &
          sleep 2
          node health.js
          kill %1

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t hazoom-os:${{ github.sha }} .
      - name: Test Docker Image
        run: |
          docker run -d -p 8888:8888 --name hazoom-test hazoom-os:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8888 || exit 1
          docker stop hazoom-test
          docker rm hazoom-test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying HAZOOM OS v${{ github.sha }}"
          echo "✅ Deployment complete"
